envVarGroups:
  - name: ecoswift-shared
    envVars:
      # Real deployment, but never NODE_ENV=production — several sandbox
      # money-movement guards (SandboxTransactionService, ExternalTransferService,
      # admin-credit) explicitly disable themselves when NODE_ENV === 'production',
      # since this platform has no licensed banking rail behind it. 'staging' keeps
      # every sandbox feature working while still being a real, live deployment.
      - key: NODE_ENV
        value: staging
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: REDIS_TLS_ENABLED
        value: 'true'
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: EMAIL_DRIVER
        value: resend
      - key: SMTP_HOST
        value: smtp.resend.com
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_USER
        value: resend
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        value: '"Ecoswift Bank" <noreply@ecoswiftbank.com>'
      - key: CUSTOMER_PORTAL_URL
        value: https://www.ecoswiftbank.com
      - key: ADMIN_PORTAL_URL
        value: https://ecoswift-platform-admin.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        value: https://www.ecoswiftbank.com,https://ecoswiftbank.com,https://ecoswift-platform-admin.vercel.app

services:
  - type: web
    name: ecoswift-auth-service
    runtime: node
    plan: free
    region: ohio
    buildCommand: pnpm install --frozen-lockfile && pnpm db:generate && pnpm exec turbo run build --filter=@ecoswift/auth-service
    startCommand: node services/auth-service/dist/main.js
    healthCheckPath: /v1/health
    envVars:
      - fromGroup: ecoswift-shared

  - type: web
    name: ecoswift-account-service
    runtime: node
    plan: free
    region: ohio
    # db:seed here (only on this one service) keeps prisma/seed.ts's
    # reference data — including notification templates — in sync with
    # production on every deploy. Safe to run repeatedly: every seed
    # function is an upsert (see seed.ts), so this never touches an
    # existing admin password or duplicates rows.
    buildCommand: pnpm install --frozen-lockfile && pnpm db:generate && pnpm db:seed && pnpm exec turbo run build --filter=@ecoswift/account-service
    startCommand: node services/account-service/dist/main.js
    healthCheckPath: /v1/health
    envVars:
      - fromGroup: ecoswift-shared

